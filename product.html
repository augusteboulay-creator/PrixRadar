<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171819">
  <title>Fiche produit · PrixRadar</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #171819;
      color: #f7eee7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: #f7eee7;
      background:
        radial-gradient(ellipse at 86% 0%, rgba(232, 101, 32, .15), transparent 34rem),
        linear-gradient(145deg, #171819, #202020 60%, #191919);
    }
    a, button { font: inherit; }
    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 26px 0 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff3e9; font-weight: 850; text-decoration: none; letter-spacing: -.03em; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid rgba(255, 155, 82, .55); border-radius: 12px; color: #ff9a53; background: rgba(255, 129, 48, .09); }
    .brand-mark svg { width: 19px; height: 19px; }
    .back-link { color: #e3b28f; text-decoration: none; font-size: 14px; font-weight: 700; }
    .back-link:hover { color: #ffad70; }
    .detail-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(24px, 5vw, 58px);
      padding: clamp(20px, 4vw, 42px);
      border: 1px solid rgba(255, 170, 112, .18);
      border-radius: 26px;
      background: rgba(35, 36, 37, .91);
      box-shadow: 0 26px 80px rgba(0, 0, 0, .28);
      animation: rise-in .45s ease both;
    }
    @keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .image-frame {
      position: relative;
      display: grid;
      min-height: 350px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 183, 128, .14);
      border-radius: 20px;
      background: radial-gradient(circle at 50% 38%, rgba(255, 145, 65, .16), transparent 48%), #1a1b1c;
    }
    .image-frame img { display: block; width: 100%; height: 100%; min-height: 350px; max-height: 580px; object-fit: contain; }
    .image-placeholder { padding: 24px; color: #b7aaa1; text-align: center; }
    .eyebrow { margin: 0 0 12px; color: #ff9b59; font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; color: #fff7f0; font-size: clamp(30px, 4vw, 48px); line-height: 1.08; letter-spacing: -.045em; }
    .category { display: inline-flex; margin-top: 17px; padding: 7px 11px; border: 1px solid rgba(255, 174, 117, .22); border-radius: 999px; color: #ffd0ac; background: rgba(255, 131, 48, .1); font-size: 12px; font-weight: 750; }
    .price { margin: 22px 0 4px; color: #ffad70; font-size: 30px; font-weight: 900; letter-spacing: -.04em; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 15px; margin: 14px 0 0; color: #c8b9af; font-size: 13px; line-height: 1.6; }
    .meta span { display: inline-flex; align-items: center; gap: 5px; }
    .section-title { margin: 30px 0 9px; color: #fff1e5; font-size: 16px; letter-spacing: -.01em; }
    .description { margin: 0; color: #c9c0b9; font-size: 15px; line-height: 1.8; white-space: pre-line; }
    .facts { display: grid; gap: 9px; margin: 14px 0 0; padding: 0; list-style: none; }
    .facts li { padding: 11px 13px; border: 1px solid rgba(255, 255, 255, .07); border-radius: 12px; color: #d2c7bf; background: rgba(255, 255, 255, .035); font-size: 13px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 26px; }
    .action {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 17px;
      border: 1px solid rgba(255, 177, 118, .34);
      border-radius: 13px;
      color: #fff5ed;
      background: linear-gradient(135deg, #ff963f, #e9641b);
      box-shadow: 0 10px 25px rgba(222, 91, 25, .18);
      font-size: 14px;
      font-weight: 850;
      text-decoration: none;
      transition: transform .18s ease, filter .18s ease;
    }
    .action:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .action.secondary { color: #ffd4b4; background: rgba(255, 143, 62, .08); box-shadow: none; }
    .notice { margin: 22px 0 0; padding: 13px 15px; border: 1px solid rgba(255, 167, 103, .15); border-radius: 13px; color: #bfb2a9; background: rgba(255, 131, 48, .055); font-size: 12px; line-height: 1.65; }
    .not-found { max-width: 700px; margin: 12vh auto; padding: 32px; border: 1px solid rgba(255, 170, 112, .18); border-radius: 22px; background: #232425; text-align: center; }
    .not-found h1 { font-size: 32px; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .page { width: min(100% - 26px, 600px); padding-top: 17px; }
      .detail-card { grid-template-columns: 1fr; gap: 25px; padding: 17px; border-radius: 20px; }
      .image-frame, .image-frame img { min-height: 250px; max-height: 410px; }
      .actions { display: grid; }
      .action { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="PrixRadar, accueil">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
        </span>
        PrixRadar
      </a>
      <a class="back-link" id="backLink" href="/">← Retour au fil</a>
    </header>

    <main id="productDetail">
      <article class="detail-card">
        <div class="image-frame" id="imageFrame">
          <img id="productImage" alt="" hidden>
          <div class="image-placeholder" id="imagePlaceholder">Image non disponible</div>
        </div>
        <div class="content">
          <p class="eyebrow" id="sourceLabel">Fiche produit</p>
          <h1 id="productTitle">Chargement…</h1>
          <span class="category" id="productCategory" hidden></span>
          <p class="price" id="productPrice" hidden></p>
          <div class="meta" id="productMeta"></div>
          <h2 class="section-title">Description</h2>
          <p class="description" id="productDescription"></p>
          <h2 class="section-title" id="factsTitle" hidden>Autres informations</h2>
          <ul class="facts" id="productFacts"></ul>
          <div class="actions">
            <a class="action" id="googleLink" target="_blank" rel="noopener noreferrer">Voir sur Google Shopping ↗</a>
            <a class="action secondary" id="sellerLink" target="_blank" rel="noopener noreferrer" hidden>Voir l’offre du vendeur ↗</a>
          </div>
          <p class="notice" id="productNotice"></p>
        </div>
      </article>
    </main>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const requestedTitle = params.get("q") || "";
      let product = null;
      try {
        product = JSON.parse(window.sessionStorage.getItem("prixradar:selectedProduct") || "null");
      } catch {}
      if (product && requestedTitle && product.title !== requestedTitle) product = null;
      if (!product || typeof product.title !== "string") {
        if (requestedTitle) product = { title: requestedTitle, _detailSource: "google" };
      }

      const main = document.getElementById("productDetail");
      if (!product || !product.title.trim()) {
        main.innerHTML = '<section class="not-found"><p class="eyebrow">Fiche produit</p><h1>Aucun produit sélectionné</h1><p class="description">Retourne au fil et clique sur un produit pour voir sa fiche.</p><div class="actions" style="justify-content:center"><a class="action" href="/">Retour au fil</a></div></section>';
        return;
      }

      const source = product._detailSource === "demo" ? "demo" : "google";
      const isDemo = source === "demo";
      const title = product.title.trim();
      document.title = title + " · PrixRadar";
      document.getElementById("productTitle").textContent = title;
      document.getElementById("sourceLabel").textContent = isDemo ? "Exemple du fil" : "Résultat Google Shopping";
      const category = product.categoryLabel || product.category || "";
      if (category) {
        const categoryTag = document.getElementById("productCategory");
        categoryTag.textContent = category;
        categoryTag.hidden = false;
      }

      const image = document.getElementById("productImage");
      const placeholder = document.getElementById("imagePlaceholder");
      const imageUrl = safeHttpsUrl(product.image);
      if (imageUrl) {
        image.src = imageUrl;
        image.alt = product.imageAlt || title;
        image.hidden = false;
        placeholder.hidden = true;
        image.addEventListener("error", () => {
          image.hidden = true;
          placeholder.hidden = false;
        }, { once: true });
      }

      const price = document.getElementById("productPrice");
      if (!isDemo && product.price) {
        price.textContent = product.price;
        price.hidden = false;
      }

      const meta = document.getElementById("productMeta");
      const addMeta = value => {
        if (!value) return;
        const span = document.createElement("span");
        span.textContent = value;
        meta.append(span);
      };
      if (!isDemo && product.source) addMeta("Vendeur : " + product.source);
      if (!isDemo && product.rating != null && Number.isFinite(Number(product.rating))) {
        let rating = Number(product.rating).toFixed(1) + " ★";
        if (Number(product.reviews) > 0) rating += " · " + new Intl.NumberFormat("fr-FR").format(Number(product.reviews)) + " avis";
        addMeta(rating);
      }
      if (!isDemo && product.delivery) addMeta(product.delivery);

      const description = String(product.description || "").trim();
      document.getElementById("productDescription").textContent = description || (
        isDemo
          ? "Cette fiche de démonstration ne contient pas d’autres caractéristiques. Utilise le bouton Google pour rechercher des informations sur ce nom."
          : "Google Shopping n’a pas fourni de description détaillée avec ce résultat. Ouvre la recherche Google pour consulter les informations disponibles sur le produit."
      );

      const facts = Array.isArray(product.details)
        ? product.details.filter(value => typeof value === "string").map(value => value.trim()).filter(Boolean).slice(0, 8)
        : [];
      if (!isDemo && product.delivery) facts.unshift("Livraison : " + product.delivery);
      const factsList = document.getElementById("productFacts");
      if (facts.length) {
        document.getElementById("factsTitle").hidden = false;
        for (const fact of facts) {
          const item = document.createElement("li");
          item.textContent = fact;
          factsList.append(item);
        }
      }

      const googleUrl = "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(title);
      document.getElementById("googleLink").href = googleUrl;

      const sellerUrl = safeHttpsUrl(product.link);
      const sellerLink = document.getElementById("sellerLink");
      if (!isDemo && sellerUrl) {
        sellerLink.href = sellerUrl;
        sellerLink.hidden = false;
      }

      document.getElementById("productNotice").textContent = isDemo
        ? "Exemple fictif : le nom, la description et le visuel de cette fiche servent à la démonstration. Le lien Google lance une recherche sur ce nom."
        : "Les informations affichées proviennent du résultat Google Shopping et peuvent être incomplètes ou changer. Vérifie le produit et son prix sur le site du vendeur.";

      document.getElementById("backLink").addEventListener("click", event => {
        try {
          if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
            event.preventDefault();
            window.history.back();
          }
        } catch {}
      });

      function safeHttpsUrl(value) {
        if (typeof value !== "string") return "";
        try {
          const url = new URL(value);
          return url.protocol === "https:" ? url.href : "";
        } catch {
          return "";
        }
      }
    })();
  </script>
</body>
</html>
